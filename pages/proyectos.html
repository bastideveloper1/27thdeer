<main>
    <link rel="stylesheet" href="css/trayectoria.css">
    <section class="trajectory" aria-label="Trayectoria">
        <div class="trajectory-toolbar">
            <div class="trajectory-filters" role="group" aria-label="Filtrar trayectoria">
                <button type="button" data-filter="all" aria-pressed="true">Todos</button>
                <button type="button" data-filter="project" aria-pressed="false">Proyectos</button>
                <button type="button" data-filter="education" aria-pressed="false">Formación</button>
                <button type="button" data-filter="milestone" aria-pressed="false">Hitos</button>
            </div>
        </div>
        <p class="trajectory-message" role="status">Cargando trayectoria…</p>
        <ol id="trajectory-line" class="trajectory-line" aria-label="Línea temporal"></ol>
        <div class="trajectory-navigation" role="group" aria-label="Recorrer trayectoria">
            <button type="button" data-direction="-1" aria-controls="trajectory-line">← Anterior</button>
            <button type="button" data-direction="1" aria-controls="trajectory-line">Siguiente →</button>
        </div>
        <dialog class="trajectory-dialog" aria-labelledby="trajectory-detail-title">
            <button type="button" class="trajectory-close" aria-label="Cerrar detalle">×</button>
            <div class="trajectory-detail"></div>
        </dialog>
    </section>
    <script src="js/trayectoria.js"></script>
</main>
