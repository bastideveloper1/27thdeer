<main>
    <link rel="stylesheet" href="../css/todo_popcorn.css">

    <section class="todo-popcorn">
        <div class="page-header">
            <img class="page-logo" src="../img/mini-icon.png" alt="Logo Rata" width="56" height="56" />
            <h1>ToDo Popcorn!</h1>
            <a href="https://www.themoviedb.org" target="_blank" rel="noopener" class="tmdb-header-link">
                <img src="../img/tmdb-logo.svg" alt="TMDB" class="tmdb-header-logo" />
            </a>
        </div>

        <div class="tutorial-carousel">
            <button type="button" id="tutorialPrev" class="tutorial-nav tutorial-nav-prev" aria-label="Anterior">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="tutorial-box">
                <div class="tutorial-card-content" id="tutorialContent"></div>
                <p class="tutorial-progress" id="tutorialProgress" aria-live="polite"></p>
            </div>
            <button type="button" id="tutorialNext" class="tutorial-nav tutorial-nav-next" aria-label="Siguiente">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

        <div class="mode-switch">
            <p class="mode-label">Selecciona qué deseas buscar</p>
            <div class="mode-toggle">
                <button type="button" class="mode-btn" data-mode="tv">Buscar una serie y sus episodios</button>
                <button type="button" class="mode-btn active" data-mode="multi-movies">Buscar series y películas</button>
            </div>
        </div>

        <div id="options" class="options options-card">
            <div class="options-header">
                <h3>Opciones de salida</h3>
                <p>Configura antes de buscar y generar tu lista para Microsoft To Do.</p>
            </div>
            <div class="option-row">
                <label><input type="checkbox" id="optSeasonEpisode" checked /> Incluir Temporada/Episodio</label>
                <label><input type="checkbox" id="optEpisodeName" checked /> Incluir Nombre del episodio</label>
                <label><input type="checkbox" id="optAirDate" /> Incluir Fecha de emisión</label>
                <label><input type="checkbox" id="optIncludeRating" /> Incluir puntuación general</label>
                <label><input type="checkbox" id="optIncludeDirector" /> Incluir Creador</label>
                <label><input type="checkbox" id="optIncludeGenre" /> Incluir Género</label>
                <label><input type="checkbox" id="optIncludeEpisodeDirector" /> Incluir Director episodio</label>
                <label><input type="checkbox" id="optEvolvingEmoji" /> Emoji en inicio temporada</label>
            </div>
            <div class="format-select">
                <span id="formatLabel">Formato para cada episodio:</span>
                <div class="format-toggle">
                    <button type="button" class="format-btn active" data-format="1">T01|E01 - Nombre</button>
                    <button type="button" class="format-btn" data-format="2">Nombre - T01|E01</button>
                </div>
            </div>
            <div class="emoji-picker">
                <label>Emoji o texto por episodio (máx 5 caracteres)</label>
                <div class="emoji-control">
                    <button id="emojiToggle" type="button">🍿</button>
                    <input id="emojiInput" type="text" placeholder="Emoji/texto (5 chars)" maxlength="5" />
                </div>
                <div id="emojiList" class="emoji-list">
                    <button type="button">🍿</button>
                    <button type="button">🎬</button>
                    <button type="button">✨</button>
                    <button type="button">🎥</button>
                    <button type="button">⭐</button>
                    <button type="button">🔥</button>
                    <button type="button">🧩</button>
                    <button type="button">🎞️</button>
                    <button type="button">👽</button>
                    <button type="button">🧙‍♂️</button>
                    <button type="button">💘</button>
                    <button type="button">🕵️‍♀️</button>
                    <button type="button">👻</button>
                    <button type="button">🤖</button>
                    <button type="button">🧪</button>
                    <button type="button">🪐</button>
                    <button type="button">🧜‍♀️</button>
                    <button type="button">🩸</button>
                </div>
            </div>
            <div class="action-row">
                <button id="viewPreviousBtn" type="button" class="secondary-btn" disabled>Ultima búsqueda</button>
                <button id="clearSearchBtn" type="button" class="secondary-btn">Limpiar búsqueda</button>
                <button id="generateBtn" type="button" class="generate-btn">Generar texto</button>
            </div>
        </div>

        <!-- Buscador y resultados -->
        <div class="search-row">
            <input id="searchInput" type="search" placeholder="Buscar serie o película..." />
            <button id="searchBtn" type="button">Buscar</button>
        </div>

        <div id="selectedMovies" class="selected-movies" style="display:none"></div>
        <div id="results" class="results"></div>

        <!-- Modal de salida con tarea y subtareas -->
        <div id="outputModal" class="output-modal">
            <div class="output-modal-card">
                <button id="closeOutputModal" class="modal-close" type="button">×</button>
                <div id="mainTaskSection">
                    <h3>Nombre de la serie/película</h3>
                    <div class="output-row">
                        <textarea id="mainTaskModal" readonly></textarea>
                        <button id="copyMain" type="button">Copiar tarea</button>
                    </div>
                </div>
                <div id="episodesSection">
                    <h3>episodios</h3>
                    <div class="output-row">
                        <textarea id="subtasksModal" readonly></textarea>
                        <button id="copySubs" type="button">Copiar subtareas</button>
                    </div>
                </div>
                <div class="tmdb-credit">
                    <a href="https://www.themoviedb.org" target="_blank" rel="noopener">
                        <img src="../img/tmdb-logo.svg" alt="TMDB" class="tmdb-logo" />
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal personalizado para alertas -->
    <div id="alertModal" class="alert-modal">
        <div class="alert-modal-card">
            <p id="alertMessage"></p>
            <button id="alertCloseBtn" type="button">Aceptar</button>
        </div>
    </div>

    <script>(function() {
        // Clave y rutas de TMDB
        const API_KEY = 'df600a328fa6b72a4d012a0ef3ab14a6';
        const IMAGE_BASE = 'https://image.tmdb.org/t/p/w300';

        // Elementos de la interfaz
        const searchInput = document.getElementById('searchInput');
        const alertModal = document.getElementById('alertModal');
        const alertMessage = document.getElementById('alertMessage');
        const alertCloseBtn = document.getElementById('alertCloseBtn');
        const searchBtn = document.getElementById('searchBtn');
        const resultsEl = document.getElementById('results');
        const selectedMoviesEl = document.getElementById('selectedMovies');
        const detailsEl = document.getElementById('details');
        const optionsEl = document.getElementById('options');
        const outputModal = document.getElementById('outputModal');
        const mainTaskModal = document.getElementById('mainTaskModal');
        const subtasksModal = document.getElementById('subtasksModal');
        const copyMainBtn = document.getElementById('copyMain');
        const copySubsBtn = document.getElementById('copySubs');
        const generateBtn = document.getElementById('generateBtn');
        const emojiInput = document.getElementById('emojiInput');
        const emojiToggle = document.getElementById('emojiToggle');
        const emojiList = document.getElementById('emojiList');
        const optSeasonEpisode = document.getElementById('optSeasonEpisode');
        const optEpisodeName = document.getElementById('optEpisodeName');
        const optAirDate = document.getElementById('optAirDate');
        const optIncludeRating = document.getElementById('optIncludeRating');
        const optIncludeDirector = document.getElementById('optIncludeDirector');
        const optIncludeGenre = document.getElementById('optIncludeGenre');
        const optIncludeEpisodeDirector = document.getElementById('optIncludeEpisodeDirector');
        const optEvolvingEmoji = document.getElementById('optEvolvingEmoji');
        const viewPreviousBtn = document.getElementById('viewPreviousBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const tutorialPrev = document.getElementById('tutorialPrev');
        const tutorialNext = document.getElementById('tutorialNext');
        const tutorialContent = document.getElementById('tutorialContent');
        const tutorialProgress = document.getElementById('tutorialProgress');
        const formatLabel = document.getElementById('formatLabel');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const formatBtns = document.querySelectorAll('.format-btn');
        const episodesSection = document.getElementById('episodesSection');
        const mainTaskSection = document.getElementById('mainTaskSection');

        let selectedItem = null;
        let selectedCard = null;
        let selectedKey = null;
        let episodesList = [];
        let selectedMovies = [];
        let currentMode = 'multi-movies';
        let lastGeneratedOutput = null;
        const tutorialCards = [
            '¡Bienvenido a ToDo Popcorn! Datos desde <a href="https://www.themoviedb.org/" target="_blank" class="tmdb-link">TMDB</a>. Genera listas para copiar en Microsoft To Do.',
            'Cada película, serie o episodio va en una línea. Al pegar en To Do, cada línea puede convertirse en una tarea o subtarea independiente.',
            'Elige el modo: «Buscar series y películas» (varios títulos) o «Buscar una serie y sus episodios» (una serie con todos sus capítulos).',
            'Modo títulos: selecciona uno o más resultados, pulsa Generar y pega la lista en «add a task». Cada línea será una tarea.',
            'Modo serie: selecciona una serie, pulsa Generar. Pega el nombre como tarea principal y los episodios en «add step» dentro de esa tarea.',
            'En «Opciones de salida» defines qué incluir: temporada/episodio, nombre del capítulo, fecha de emisión (series) o puntuación TMDB (títulos). Configura antes de buscar.',
            'Episodios: Formato 1 (T01|E01 - Nombre) o Formato 2 (Nombre - T01|E01). Opcional: emoji o texto (máx. 5 caracteres) delante de cada línea.',
            '«Emoji en inicio temporada» (solo series): 🍿 marca el primer capítulo de cada temporada.',
            'Busca el contenido, selecciona resultados, pulsa Generar y copia el texto del modal para pegarlo en Microsoft To Do.',
            'Comprueba que cada episodio quede como subtarea aparte. Recomendamos la app de escritorio; en móvil a veces varias líneas se pegan como una sola tarea.'
        ];

        let tutorialIndex = 0;

        function renderTutorialCard() {
            tutorialContent.innerHTML = tutorialCards[tutorialIndex];
            tutorialProgress.textContent = `${tutorialIndex + 1} / ${tutorialCards.length}`;
            tutorialPrev.classList.toggle('at-edge', tutorialIndex === 0);
            tutorialNext.classList.toggle('at-edge', tutorialIndex === tutorialCards.length - 1);
        }

        function goTutorial(delta) {
            tutorialIndex = (tutorialIndex + delta + tutorialCards.length) % tutorialCards.length;
            renderTutorialCard();
        }

        tutorialPrev.addEventListener('click', () => goTutorial(-1));
        tutorialNext.addEventListener('click', () => goTutorial(1));

        function updateModeUI() {
            const isTV = currentMode === 'tv';
            const isMulti = currentMode === 'multi-movies';
            optSeasonEpisode.disabled = !isTV;
            optEpisodeName.disabled = !isTV;
            optAirDate.disabled = !isTV;
            optEvolvingEmoji.disabled = !isTV;
            optIncludeEpisodeDirector.disabled = !isTV;
            emojiInput.disabled = !isTV;
            emojiToggle.disabled = !isTV;
            document.querySelectorAll('input[name="format"]').forEach(input => input.disabled = !isTV);
            formatLabel.textContent = isTV ? 'Formato para cada episodio:' : 'Formato para cada episodio: (para series)';

            // Marcar por defecto las opciones de temporada/episodio y nombre en modo TV
            if (isTV) {
                optSeasonEpisode.checked = true;
                optEpisodeName.checked = true;
            }
            searchInput.placeholder = 'Buscar serie o película...';
            selectedMoviesEl.style.display = isMulti && selectedMovies.length ? 'flex' : 'none';
            if (!isMulti) {
                selectedMovies = [];
                updateSelectedMoviesPreview();
                resultsEl.querySelectorAll('.result-item.selected').forEach(card => card.classList.remove('selected'));
            }
            selectedItem = null;
            selectedCard = null;

            // Agregar/eliminar clase option-unavailable según el modo
            const tvOnlyOptions = [optSeasonEpisode, optEpisodeName, optAirDate, optEvolvingEmoji, optIncludeEpisodeDirector];
            tvOnlyOptions.forEach(opt => {
                const label = opt.parentElement;
                if (!isTV) {
                    label.classList.add('option-unavailable');
                    opt.checked = false;
                } else {
                    label.classList.remove('option-unavailable');
                }
            });

            // Formato también en modo multi-movies
            const formatBtns = document.querySelectorAll('.format-btn');
            formatBtns.forEach(btn => {
                if (!isTV) {
                    btn.classList.add('option-unavailable');
                    btn.disabled = true;
                } else {
                    btn.classList.remove('option-unavailable');
                    btn.disabled = false;
                }
            });

            // Verificar disponibilidad de formato según opciones marcadas
            updateFormatAvailability();
        }

        function updateFormatAvailability() {
            const isTV = currentMode === 'tv';
            const hasSeasonEpisode = optSeasonEpisode.checked;
            const hasEpisodeName = optEpisodeName.checked;
            const formatBtns = document.querySelectorAll('.format-btn');

            if (!isTV || !(hasSeasonEpisode && hasEpisodeName)) {
                // Deshabilitar formato si no está en modo TV o si no tiene ambas opciones necesarias
                formatBtns.forEach(btn => {
                    btn.classList.add('option-unavailable');
                    btn.disabled = true;
                });
            } else {
                // Habilitar formato si está en modo TV y tiene ambas opciones necesarias
                formatBtns.forEach(btn => {
                    btn.classList.remove('option-unavailable');
                    btn.disabled = false;
                });
            }
        }

        // Event listeners para verificar disponibilidad de formato
        optSeasonEpisode.addEventListener('change', updateFormatAvailability);
        optEpisodeName.addEventListener('change', updateFormatAvailability);

        // Función para mostrar alerta personalizada
        function showAlert(message) {
            alertMessage.textContent = message;
            alertModal.classList.add('visible');
        }

        // Event listener para cerrar modal de alerta
        alertCloseBtn.addEventListener('click', () => {
            alertModal.classList.remove('visible');
        });
        alertModal.addEventListener('click', (event) => {
            if (event.target === alertModal) alertModal.classList.remove('visible');
        });

        const MAX_MOVIES = 20;

        let selectedMoviesPage = 0;
        const MOVIES_PER_PAGE = 5;

        function updateSelectedMoviesPreview() {
            if (!selectedMovies.length) {
                selectedMoviesEl.innerHTML = '';
                selectedMoviesEl.style.display = 'none';
                return;
            }

            const totalPages = Math.ceil(selectedMovies.length / MOVIES_PER_PAGE);
            const startIndex = selectedMoviesPage * MOVIES_PER_PAGE;
            const endIndex = startIndex + MOVIES_PER_PAGE;
            const currentMovies = selectedMovies.slice(startIndex, endIndex);

            selectedMoviesEl.style.display = 'flex';
            selectedMoviesEl.style.flexDirection = 'column';
            selectedMoviesEl.style.alignItems = 'center';

            let html = '<div style="display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;">';
            html += currentMovies.map(movie => {
                const imgSrc = movie.poster_path ? IMAGE_BASE + movie.poster_path : '../img/mini-icon.png';
                return `
                    <div class="movie-chip" data-key="${getItemKey(movie)}">
                        <img src="${imgSrc}" alt="Poster" class="movie-chip-img" />
                        <button type="button" class="remove-movie" aria-label="Quitar">×</button>
                    </div>
                `;
            }).join('');
            html += '</div>';

            if (totalPages > 1) {
                html += `
                    <div style="display: flex; gap: 1rem; margin-top: 0.5rem; align-items: center;">
                        <button type="button" class="pagination-btn" ${selectedMoviesPage === 0 ? 'disabled' : ''} data-page="${selectedMoviesPage - 1}">‹</button>
                        <span style="color: #777; font-size: 0.85rem;">${selectedMoviesPage + 1} / ${totalPages}</span>
                        <button type="button" class="pagination-btn" ${selectedMoviesPage >= totalPages - 1 ? 'disabled' : ''} data-page="${selectedMoviesPage + 1}">›</button>
                    </div>
                `;
            }

            selectedMoviesEl.innerHTML = html;

            selectedMoviesEl.querySelectorAll('.remove-movie').forEach(button => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation();
                    const chip = event.target.closest('.movie-chip');
                    const key = chip.dataset.key;
                    selectedMovies = selectedMovies.filter(movie => getItemKey(movie) !== key);
                    if (selectedMoviesPage > 0 && selectedMoviesPage >= Math.ceil(selectedMovies.length / MOVIES_PER_PAGE)) {
                        selectedMoviesPage = Math.max(0, selectedMoviesPage - 1);
                    }
                    updateSelectedMoviesPreview();
                    resultsEl.querySelectorAll('.result-item').forEach(card => {
                        if (card.dataset.key === key) card.classList.remove('selected');
                    });
                });
            });

            selectedMoviesEl.querySelectorAll('.pagination-btn').forEach(button => {
                button.addEventListener('click', () => {
                    if (!button.disabled) {
                        selectedMoviesPage = parseInt(button.dataset.page);
                        updateSelectedMoviesPreview();
                    }
                });
            });
        }

        // Eventos de la página
        searchBtn.addEventListener('click', () => {
            console.log('Buscar clic', currentMode, searchInput.value);
            doSearch();
        });
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
        emojiToggle.addEventListener('click', () => emojiList.classList.toggle('visible'));
        emojiList.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', () => {
                emojiInput.value = button.textContent.trim();
                emojiList.classList.remove('visible');
            });
        });
        optEvolvingEmoji.addEventListener('change', () => {
            const disabled = optEvolvingEmoji.checked;
            emojiInput.disabled = disabled;
            emojiToggle.disabled = disabled;
        });
        document.addEventListener('click', (event) => {
            if (!emojiToggle.contains(event.target) && !emojiList.contains(event.target)) {
                emojiList.classList.remove('visible');
            }
        });
        document.getElementById('closeOutputModal').addEventListener('click', () => outputModal.classList.remove('visible'));
        outputModal.addEventListener('click', (event) => {
            if (event.target === outputModal) outputModal.classList.remove('visible');
        });
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentMode = btn.dataset.mode;
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateModeUI();
            });
        });

        formatBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                formatBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        viewPreviousBtn.addEventListener('click', () => {
            if (!lastGeneratedOutput) return showAlert('No hay lista anterior disponible.');
            mainTaskModal.value = lastGeneratedOutput.main;
            subtasksModal.value = lastGeneratedOutput.subs;
            if (lastGeneratedOutput.hasEpisodes) {
                mainTaskSection.style.display = 'block';
                episodesSection.style.display = 'block';
                episodesSection.querySelector('h3').textContent = 'episodios';
            } else {
                mainTaskSection.style.display = 'none';
                episodesSection.style.display = 'block';
                episodesSection.querySelector('h3').textContent = 'Lista de títulos';
            }
            outputModal.classList.add('visible');
        });

        clearSearchBtn.addEventListener('click', () => {
            selectedMovies = [];
            selectedMoviesPage = 0;
            updateSelectedMoviesPreview();
            resultsEl.querySelectorAll('.result-item.selected').forEach(card => card.classList.remove('selected'));
            searchInput.value = '';
            resultsEl.innerHTML = '';
            selectedItem = null;
            selectedCard = null;
            selectedKey = null;
            episodesList = [];
        });

        async function doSearch() {
            const q = searchInput.value.trim();
            if (!q) return;
            console.log('doSearch', { query: q, mode: currentMode });
            resultsEl.innerHTML = '<p>Cargando resultados...</p>';
            outputModal.classList.remove('visible');

            let url;
            if (currentMode === 'tv') {
                url = `https://api.themoviedb.org/3/search/tv?api_key=${API_KEY}&language=es-ES&query=${encodeURIComponent(q)}&include_adult=false`;
            } else {
                url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=es-ES&query=${encodeURIComponent(q)}&include_adult=false`;
            }
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Error en la búsqueda: ' + res.status);
                const data = await res.json();
                displayResults(data.results || []);
            } catch (error) {
                console.error('Búsqueda fallida', error);
                resultsEl.innerHTML = '<p>Error buscando resultados. Por favor intenta de nuevo.</p>';
            }
        }

        function getItemKey(it) {
            return `${it.media_type || (it.title ? 'movie' : 'tv')}-${it.id}`;
        }

        function getDirectorsFromCredits(credits) {
            if (!credits || !credits.crew) return '';
            const names = credits.crew
                .filter(person => person.job === 'Director')
                .map(person => person.name);
            return [...new Set(names)].join(', ');
        }

        function displayResults(items) {
            if (!items.length) {
                resultsEl.innerHTML = '<p>No se encontraron resultados.</p>';
                return;
            }
            resultsEl.innerHTML = '';

            items.forEach(it => {
                const mediaType = it.media_type || (currentMode === 'tv' ? 'tv' : 'movie');
                if (mediaType === 'person') return;

                const div = document.createElement('div');
                div.className = 'result-item';
                const img = document.createElement('img');
                img.src = it.poster_path ? (IMAGE_BASE + it.poster_path) : '../img/mini-icon.png';
                div.appendChild(img);

                const info = document.createElement('div');
                info.className = 'result-info';
                const title = it.title || it.name || 'Sin título';
                const date = it.release_date || it.first_air_date || '';
                const year = date ? date.split('-')[0] : '';
                info.innerHTML = `
                    <h4>${title}${year ? ' (' + year + ')' : ''}</h4>
                    <p class="result-overview">${(it.overview || '').slice(0, 220)}</p>
                    <p class="result-director"></p>
                `;
                const badge = document.createElement('div');
                badge.className = 'result-badge';
                const directorEl = info.querySelector('.result-director');
                const meta = document.createElement('p');
                meta.className = 'result-meta';
                meta.textContent = it.vote_average ? `⭐ ${it.vote_average.toFixed(1)} / 10` : '';

                if (mediaType === 'tv') {
                    badge.textContent = 'Serie';
                    fetch(`https://api.themoviedb.org/3/tv/${it.id}?api_key=${API_KEY}&language=es-ES&append_to_response=credits`)
                        .then(res => res.json())
                        .then(tv => {
                            if (tv.number_of_seasons && tv.number_of_episodes) {
                                badge.textContent = `${tv.number_of_seasons} temp. · ${tv.number_of_episodes} ep.`;
                            }
                            if (tv.vote_average) {
                                meta.textContent = `⭐ ${tv.vote_average.toFixed(1)} / 10`;
                            }
                            const directors = tv.created_by?.length
                                ? tv.created_by.map(person => person.name).join(', ')
                                : getDirectorsFromCredits(tv.credits);
                            if (directors) {
                                directorEl.textContent = directors;
                            }
                        })
                        .catch(() => { badge.textContent = 'Serie'; });
                } else {
                    badge.textContent = 'Película';
                    fetch(`https://api.themoviedb.org/3/movie/${it.id}?api_key=${API_KEY}&language=es-ES&append_to_response=credits`)
                        .then(res => res.json())
                        .then(movie => {
                            const duration = movie.runtime ? `${movie.runtime} min` : '';
                            badge.textContent = duration || 'Película';
                            if (movie.vote_average) {
                                meta.textContent = `⭐ ${movie.vote_average.toFixed(1)} / 10`;
                            }
                            const directors = getDirectorsFromCredits(movie.credits);
                            if (directors) {
                                directorEl.textContent = directors;
                            }
                        })
                        .catch(() => { badge.textContent = 'Película'; });
                }

                div.appendChild(badge);
                div.appendChild(info);
                info.appendChild(meta);
                div.dataset.key = getItemKey(it);
                if (currentMode === 'multi-movies' && selectedMovies.some(movie => getItemKey(movie) === div.dataset.key)) {
                    div.classList.add('selected');
                }
                div.addEventListener('click', () => toggleSelection(it, div));
                resultsEl.appendChild(div);
            });
        }

        async function toggleSelection(it, card) {
            if (currentMode === 'multi-movies') {
                toggleMovieSelection(it, card);
                return;
            }

            const key = getItemKey(it);
            const same = selectedKey === key;
            if (same) {
                selectedItem = null;
                selectedCard?.classList.remove('selected');
                selectedCard = null;
                selectedKey = null;
                outputModal.classList.remove('visible');
                return;
            }

            if (selectedCard) selectedCard.classList.remove('selected');
            selectedItem = it;
            selectedCard = card;
            selectedKey = key;
            card.classList.add('selected');
            if (card.parentElement) card.parentElement.prepend(card);
            outputModal.classList.remove('visible');
            await loadDetails(it);
        }

        async function toggleMovieSelection(it, card) {
            const key = getItemKey(it);
            const existingIndex = selectedMovies.findIndex(movie => getItemKey(movie) === key);
            if (existingIndex >= 0) {
                selectedMovies.splice(existingIndex, 1);
                card.classList.remove('selected');
            } else {
                // Obtener creador antes de agregar
                const isTV = it.media_type === 'tv' || (!it.title && it.name);
                try {
                    if (isTV) {
                        const tvRes = await fetch(`https://api.themoviedb.org/3/tv/${it.id}?api_key=${API_KEY}&language=es-ES`);
                        const tv = await tvRes.json();
                        // Usar campo created_by de TMDB para series
                        if (tv.created_by && tv.created_by.length > 0) {
                            it.director = tv.created_by.map(c => c.name).join(', ');
                        } else {
                            // Fallback a credits/crew
                            const creditsRes = await fetch(`https://api.themoviedb.org/3/tv/${it.id}/credits?api_key=${API_KEY}&language=es-ES`);
                            const credits = await creditsRes.json();
                            const creators = credits.crew?.filter(c => c.job === 'Creator') || [];
                            const executiveProducers = credits.crew?.filter(c => c.job === 'Executive Producer') || [];
                            it.director = creators.length > 0 ? creators.map(c => c.name).join(', ') : 
                                          executiveProducers.length > 0 ? executiveProducers.map(c => c.name).join(', ') : '';
                        }
                        // Obtener géneros
                        if (tv.genres && tv.genres.length > 0) {
                            it.genres = tv.genres.map(g => g.name).join(', ');
                        } else {
                            it.genres = '';
                        }
                    } else {
                        const creditsRes = await fetch(`https://api.themoviedb.org/3/movie/${it.id}/credits?api_key=${API_KEY}&language=es-ES`);
                        const credits = await creditsRes.json();
                        const creators = credits.crew?.filter(c => c.job === 'Creator') || [];
                        const directors = credits.crew?.filter(c => c.job === 'Director') || [];
                        it.director = creators.length > 0 ? creators.map(c => c.name).join(', ') : 
                                      directors.length > 0 ? directors.map(d => d.name).join(', ') : '';
                        // Obtener géneros de la película
                        const movieRes = await fetch(`https://api.themoviedb.org/3/movie/${it.id}?api_key=${API_KEY}&language=es-ES`);
                        const movie = await movieRes.json();
                        if (movie.genres && movie.genres.length > 0) {
                            it.genres = movie.genres.map(g => g.name).join(', ');
                        } else {
                            it.genres = '';
                        }
                    }
                } catch (e) {
                    console.warn('credits fetch failed', e);
                    it.director = '';
                    it.genres = '';
                }
                selectedMovies.push(it);
                card.classList.add('selected');
            }
            updateSelectedMoviesPreview();
        }

        async function loadDetails(it) {
            outputModal.classList.remove('visible');
            const isTV = it.media_type === 'tv' || (!it.title && it.name);

            if (isTV) {
                const id = it.id;
                const res = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${API_KEY}&language=es-ES`);
                const tv = await res.json();
                episodesList = [];
                const seasons = (tv.seasons || []).filter(s => s.season_number > 0);

                // Obtener creadores de la serie usando el campo created_by de TMDB
                if (tv.created_by && tv.created_by.length > 0) {
                    it.director = tv.created_by.map(c => c.name).join(', ');
                } else {
                    // Fallback a credits/crew si no hay created_by
                    try {
                        const creditsRes = await fetch(`https://api.themoviedb.org/3/tv/${id}/credits?api_key=${API_KEY}&language=es-ES`);
                        const credits = await creditsRes.json();
                        const creators = credits.crew?.filter(c => c.job === 'Creator') || [];
                        const executiveProducers = credits.crew?.filter(c => c.job === 'Executive Producer') || [];
                        it.director = creators.length > 0 ? creators.map(c => c.name).join(', ') :
                                      executiveProducers.length > 0 ? executiveProducers.map(c => c.name).join(', ') : '';
                    } catch (e) {
                        console.warn('credits fetch failed', e);
                        it.director = '';
                    }
                }

                // Obtener géneros
                if (tv.genres && tv.genres.length > 0) {
                    it.genres = tv.genres.map(g => g.name).join(', ');
                } else {
                    it.genres = '';
                }

                for (const s of seasons) {
                    const seasonNum = s.season_number;
                    try {
                        const rs = await fetch(`https://api.themoviedb.org/3/tv/${id}/season/${seasonNum}?api_key=${API_KEY}&language=es-ES`);
                        const seasonData = await rs.json();
                        const eps = seasonData.episodes || [];
                        eps.forEach(ep => {
                            episodesList.push({ season: seasonNum, episode: ep.episode_number, name: ep.name, air_date: ep.air_date, director: '' });
                        });
                    } catch (e) {
                        console.warn('season fetch failed', e);
                    }
                }
                episodesList.sort((a, b) => (a.season - b.season) || (a.episode - b.episode));
            } else {
                const title = it.title || it.name;
                const date = it.release_date || it.first_air_date || '';
                episodesList = [{ season: null, episode: null, name: title, air_date: date, director: '' }];

                // Obtener creador de la película
                try {
                    const creditsRes = await fetch(`https://api.themoviedb.org/3/movie/${it.id}/credits?api_key=${API_KEY}&language=es-ES`);
                    const credits = await creditsRes.json();
                    const creators = credits.crew?.filter(c => c.job === 'Creator') || [];
                    const directors = credits.crew?.filter(c => c.job === 'Director') || [];
                    it.director = creators.length > 0 ? creators.map(c => c.name).join(', ') :
                                  directors.length > 0 ? directors.map(d => d.name).join(', ') : '';
                } catch (e) {
                    console.warn('credits fetch failed', e);
                    it.director = '';
                }

                // Obtener géneros de la película
                try {
                    const movieRes = await fetch(`https://api.themoviedb.org/3/movie/${it.id}?api_key=${API_KEY}&language=es-ES`);
                    const movie = await movieRes.json();
                    if (movie.genres && movie.genres.length > 0) {
                        it.genres = movie.genres.map(g => g.name).join(', ');
                    } else {
                        it.genres = '';
                    }
                } catch (e) {
                    console.warn('movie details fetch failed', e);
                    it.genres = '';
                }
            }
        }

        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function getEvolutionEmoji(index, episodes) {
            const current = episodes[index];
            const isFirstOfSeason = index === 0 || (index > 0 && current.season !== episodes[index - 1].season);
            if (isFirstOfSeason) return '🍿';
            return '';
        }

        generateBtn.addEventListener('click', async () => {
            if (currentMode === 'multi-movies') {
                if (!selectedMovies.length) return showAlert('Selecciona al menos una película.');
                generateMovieList();
                return;
            }
            if (!selectedItem) return showAlert('Selecciona una serie o película primero');

            const includeSE = optSeasonEpisode.checked;
            const includeName = optEpisodeName.checked;
            const includeDate = optAirDate.checked;
            const includeDirector = optIncludeDirector.checked;
            const includeGenre = optIncludeGenre.checked;
            const includeEpisodeDirector = optIncludeEpisodeDirector.checked;
            const formatBtn = document.querySelector('.format-btn.active');
            const format = formatBtn ? formatBtn.dataset.format : '1';
            const emoji = emojiInput.value || '';
            const useEvolution = optEvolvingEmoji.checked;
            const title = selectedItem.title || selectedItem.name || selectedItem.original_name || '';
            const date = selectedItem.release_date || selectedItem.first_air_date || '';
            const ratingSuffix = optIncludeRating.checked && selectedItem.vote_average ? ` ⭐${selectedItem.vote_average.toFixed(1)} / 10` : '';
            const directorSuffix = includeDirector && selectedItem.director ? ` | Creador: ${selectedItem.director}` : '';
            const genreSuffix = includeGenre && selectedItem.genres ? ` | ${selectedItem.genres}` : '';
            mainTaskModal.value = `${title}${date ? ' (' + date.split('-')[0] + ')' : ''}${ratingSuffix}${directorSuffix}${genreSuffix}`;

            let lines = [];
            if (episodesList.length === 1 && episodesList[0].season == null) {
                let line = `${emoji}${episodesList[0].name}`.trim();
                if (useEvolution) {
                    line = getEvolutionEmoji(0, episodesList) + ' ' + episodesList[0].name;
                }
                lines.push(line.trim());
            } else {
                // Obtener directores de episodios si está seleccionado
                if (includeEpisodeDirector) {
                    const id = selectedItem.id;
                    for (const ep of episodesList) {
                        if (ep.season != null) {
                            try {
                                const epRes = await fetch(`https://api.themoviedb.org/3/tv/${id}/season/${ep.season}/episode/${ep.episode}/credits?api_key=${API_KEY}&language=es-ES`);
                                const epCredits = await epRes.json();
                                const directors = epCredits.crew?.filter(c => c.job === 'Director') || [];
                                ep.director = directors.length > 0 ? directors.map(d => d.name).join(', ') : '';
                            } catch (e) {
                                console.warn('episode credits fetch failed', e);
                                ep.director = '';
                            }
                        }
                    }
                }

                episodesList.forEach((ep, index) => {
                    const s = ep.season; const e = ep.episode;
                    let seCode = '';
                    if (includeSE && s != null) { seCode = 'T' + pad(s) + '|' + pad(e); }
                    const name = includeName ? ep.name : '';
                    const dateStr = includeDate && ep.air_date ? ` (${ep.air_date})` : '';
                    const directorStr = includeEpisodeDirector && ep.director ? ` | Dir: ${ep.director}` : '';
                    let line = '';
                    if (format === '1') {
                        line = seCode + (seCode && name ? ' - ' : '') + name + dateStr + directorStr;
                    } else {
                        line = name + (name && seCode ? ' - ' : '') + seCode + dateStr + directorStr;
                    }
                    if (useEvolution) {
                        line = getEvolutionEmoji(index, episodesList) + ' ' + line;
                    } else if (emoji) {
                        line = emoji + ' ' + line;
                    }
                    lines.push(line.trim());
                });
            }

            subtasksModal.value = lines.join('\n');
            mainTaskSection.style.display = 'block';
            episodesSection.style.display = 'block';
            episodesSection.querySelector('h3').textContent = 'episodios';
            lastGeneratedOutput = { main: mainTaskModal.value, subs: subtasksModal.value, hasEpisodes: true };
            outputModal.classList.add('visible');
        });

        function generateMovieList() {
            const includeDate = optAirDate.checked;
            const emoji = emojiInput.value || '';
            const includeRating = optIncludeRating.checked;
            const includeDirector = optIncludeDirector.checked;
            const includeGenre = optIncludeGenre.checked;

            const lines = selectedMovies.map(movie => {
                const title = movie.title || movie.name || 'Sin título';
                const date = movie.release_date || movie.first_air_date || '';
                const year = date ? ` (${date.split('-')[0]})` : '';
                const rating = includeRating && movie.vote_average ? ` ⭐${movie.vote_average.toFixed(1)} / 10` : '';
                const director = includeDirector && movie.director ? ` | Creador: ${movie.director}` : '';
                const genre = includeGenre && movie.genres ? ` | ${movie.genres}` : '';
                const dateStr = includeDate && date ? ` ${date}` : '';
                let line = `${title}${year}${rating}${director}${genre}`.trim();
                if (emoji) {
                    line = `${emoji} ${line}`.trim();
                }
                if (dateStr) {
                    line += dateStr;
                }
                return line;
            });

            mainTaskModal.value = '';
            subtasksModal.value = lines.join('\n');
            mainTaskSection.style.display = 'none';
            episodesSection.style.display = 'block';
            episodesSection.querySelector('h3').textContent = 'Lista de títulos';
            lastGeneratedOutput = { main: mainTaskModal.value, subs: subtasksModal.value, hasEpisodes: false };
            viewPreviousBtn.disabled = false;
            outputModal.classList.add('visible');
        }

        async function copyField(field, successMessage) {
            try {
                await navigator.clipboard.writeText(field.value);
                field.select();
                showAlert(successMessage);
            } catch (error) {
                field.select();
                document.execCommand('copy');
                showAlert(successMessage);
            }
        }

        async function copyAndReset(field, successMessage) {
            await copyField(field, successMessage);
            if (currentMode === 'multi-movies') {
                resetMovieSelection();
            }
        }

        copyMainBtn.addEventListener('click', () => copyAndReset(mainTaskModal, 'Tarea copiada'));
        copySubsBtn.addEventListener('click', () => copyAndReset(subtasksModal, 'Subtareas copiadas'));

        function resetMovieSelection() {
            selectedMovies = [];
            updateSelectedMoviesPreview();
            resultsEl.querySelectorAll('.result-item.selected').forEach(card => card.classList.remove('selected'));
            searchInput.value = '';
        }

        renderTutorialCard();
        updateModeUI();

    })();
    </script>
</main>
